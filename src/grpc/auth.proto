syntax = "proto3";

package auth;

service AuthService {
  rpc GetUserById (GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  string userId = 1;
}

message UserData {
  string id = 1;
  string username = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
}

message UserResponse {
  bool success = 1;
  string message = 2;
  UserData data = 3;
}
